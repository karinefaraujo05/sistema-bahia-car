name: Backup diario do banco

# Faz um dump do banco (Neon) e envia pro bucket de backup no R2, todo dia.
# De graca: repositorio publico, GitHub Actions ilimitado.
#
# Pre-requisitos (uma vez so): cadastrar os Secrets do repositorio em
#   Settings > Secrets and variables > Actions > New repository secret:
#     DATABASE_URL           string de conexao do Neon (a mesma do Render)
#     BACKUP_BUCKET          bahia-car-backups
#     AWS_S3_ENDPOINT_URL    https://<account-id>.r2.cloudflarestorage.com
#     AWS_ACCESS_KEY_ID      chave do token R2
#     AWS_SECRET_ACCESS_KEY  segredo do token R2
on:
  schedule:
    - cron: "30 6 * * *" # todo dia 03h30 (Bahia) = 06h30 UTC
  workflow_dispatch: {} # permite rodar na mao pelo botao "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar pg_dump 18 (o Neon roda Postgres 18; o cliente tem que ser >= servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # Garante que o 'pg_dump' da PATH seja o 18 (e nao o 16 que ja vem no runner).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Rodar o backup (dump -> R2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backup.sh
