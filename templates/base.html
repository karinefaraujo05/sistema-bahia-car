{% load static django_htmx %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174f5b" />
    <title>{% block titulo %}Bahia Car{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    {% django_htmx_script %}
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="bg-superficie border-b border-borda">
      <div class="mx-auto flex max-w-screen-sm items-center justify-between px-4 py-3">
        <a href="{% url 'inicio' %}" class="text-xl font-bold text-petroleo-700">Bahia Car</a>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'contas:sair' %}">
            {% csrf_token %}
            <button type="submit" class="text-tinta-suave hover:text-tinta">Sair</button>
          </form>
        {% endif %}
      </div>
    </header>

    <main class="mx-auto max-w-screen-sm px-4 py-5">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for mensagem in messages %}
            <div class="rounded-lg border border-borda bg-superficie px-4 py-3">{{ mensagem }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block conteudo %}{% endblock %}
    </main>
  </body>
</html>
