{% with ns=request.resolver_match.namespace nome=request.resolver_match.url_name %}
<aside
  id="sidebar"
  class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-sidebar-borda bg-sidebar text-tinta transition-transform md:static md:translate-x-0"
>
  <div class="flex h-16 items-center gap-2.5 border-b border-sidebar-borda px-4">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-acento-600 text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8A3 3 0 0 0 2 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
    </span>
    <div class="leading-tight">
      <div class="text-lg font-extrabold tracking-tight">Bahia Car</div>
      <div class="text-[10px] font-semibold uppercase tracking-wider text-[#9aa4b2]">Gestão inteligente</div>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-3" aria-label="Menu">
    <a href="{% url 'inicio' %}" class="sidebar-item{% if nome == 'inicio' or nome == 'buscar' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>Início</span>
    </a>
    <a href="{% url 'veiculos:estoque' %}" class="sidebar-item{% if ns == 'veiculos' and nome != 'patio' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8A3 3 0 0 0 2 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
      <span>Estoque</span>
    </a>
    <a href="{% url 'pessoas:lista' %}" class="sidebar-item{% if ns == 'pessoas' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Pessoas</span>
    </a>
    <a href="{% url 'negocios:vendas' %}" class="sidebar-item{% if ns == 'negocios' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Vendas</span>
    </a>
    <a href="{% url 'consulta' %}" class="sidebar-item{% if nome == 'consulta' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Consulta</span>
    </a>
    <a href="{% url 'veiculos:patio' %}" class="sidebar-item{% if nome == 'patio' %} sidebar-item-ativo{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
      <span>Modo pátio</span>
    </a>
  </nav>
</aside>
{% endwith %}
