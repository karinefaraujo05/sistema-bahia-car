<!doctype html>
{% load contratos_extras %}
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Compacto para caber, de preferência, em uma única folha A4. */
      @page {
        size: A4;
        margin: 1.4cm 1.6cm 1.2cm;
      }
      body {
        font-family: "DejaVu Serif", "Times New Roman", serif;
        font-size: 9.3pt;
        line-height: 1.28;
        color: #1b1b1b;
      }
      .marca {
        text-align: center;
        font-family: "DejaVu Sans", sans-serif;
        text-transform: uppercase;
        letter-spacing: 1.2pt;
        font-size: 7.5pt;
        font-weight: bold;
        color: #16525c;
        border-bottom: 1pt solid #16525c;
        padding-bottom: 4pt;
        margin-bottom: 8pt;
      }
      .titulo {
        text-align: center;
        font-size: 12pt;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.4pt;
        margin: 2pt 0 2pt;
      }
      .subtitulo {
        text-align: center;
        font-size: 8.5pt;
        color: #555;
        margin: 0 auto 9pt;
        padding-bottom: 7pt;
        border-bottom: 0.6pt solid #c7d2d4;
        width: 60%;
      }
      p {
        text-align: justify;
        margin: 0 0 4pt;
      }
      p.clausula {
        margin-top: 5pt;
      }
      p.parte {
        text-align: left;
      }
      .assinaturas {
        white-space: pre-wrap;
        font-family: inherit;
        font-size: 9pt;
        line-height: 1.5;
        margin-top: 13pt;
      }
      strong {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    {% if loja.nome_fantasia or loja.razao_social %}
      <div class="marca">
        {{ loja.nome_fantasia|default:loja.razao_social }}{% if loja.cidade %} · {{ loja.cidade }}{% if loja.uf %} - {{ loja.uf }}{% endif %}{% endif %}
      </div>
    {% endif %}

    {{ contrato.corpo|formatar_contrato }}
  </body>
</html>
