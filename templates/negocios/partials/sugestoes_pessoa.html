{# Sugestões de cliente no passo "quem". Cada uma envia o form-quem já com a pessoa. #}
{% if termo %}
  {% if pessoas %}
    <ul class="divide-y divide-borda overflow-hidden rounded-xl border border-borda bg-superficie shadow-sm">
      {% for p in pessoas %}
        <li>
          <button type="submit" form="form-quem" name="pessoa" value="{{ p.pk }}"
                  class="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-acento-50">
            <span class="avatar">{{ p.nome|first|upper }}</span>
            <span class="min-w-0 flex-1">
              <span class="block truncate text-lg font-medium">{{ p.nome }}</span>
              <span class="block text-sm text-tinta-suave">
                {% if p.telefone %}{{ p.telefone_formatado }}{% endif %}{% if p.cpf_cnpj %} · {{ p.cpf_cnpj_formatado }}{% endif %}
              </span>
            </span>
            <svg class="h-5 w-5 shrink-0 text-tinta-suave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="rounded-xl border border-dashed border-borda bg-superficie px-4 py-5 text-center">
      <p class="text-tinta-suave">Ninguém encontrado para "{{ termo }}".</p>
      <a href="{% url 'pessoas:novo' %}?next={% url 'negocios:passo_pessoa' negocio.pk %}" class="botao botao-secundario mt-3">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
        Cadastrar nova pessoa
      </a>
    </div>
  {% endif %}
{% endif %}
