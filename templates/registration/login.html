{% extends "base.html" %}

{% block titulo %}Entrar — Bahia Car{% endblock %}

{% block conteudo %}
  <div class="mx-auto max-w-sm">
    <h1 class="mb-1 text-2xl">Entrar</h1>
    <p class="mb-6 text-tinta-suave">Use seu usuário e senha para acessar o sistema.</p>

    {% if form.errors %}
      <div class="mb-4 rounded-lg border border-ambar bg-ambar-fundo px-4 py-3 text-tinta">
        Usuário ou senha incorretos. Tente de novo.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="{{ form.username.id_for_label }}" class="mb-1 block font-medium">Usuário</label>
        <input
          type="text"
          name="{{ form.username.html_name }}"
          id="{{ form.username.id_for_label }}"
          class="campo"
          autocapitalize="none"
          autocomplete="username"
          autofocus
          required
        />
      </div>

      <div>
        <label for="{{ form.password.id_for_label }}" class="mb-1 block font-medium">Senha</label>
        <input
          type="password"
          name="{{ form.password.html_name }}"
          id="{{ form.password.id_for_label }}"
          class="campo"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="botao botao-primario w-full">Entrar</button>
    </form>
  </div>
{% endblock %}
